<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <h1>Buscador de móvils</h1>

<form>
    <label>
        Marca:
        <input list="marcas" name="marca">
    </label>

    <datalist id="marcas">
        <option value="Samsung"></option>
        <option value="Apple"></option>
        <option value="Xiaomi"></option>
        <option value="Huawei"></option>
        <option value="Google"></option>
    </datalist>

    <br><br>

    <label>
        Rang de preus
        <select name="precio">
           
            <option value="0-200">Menys de 200€</option>
            <option value="200-500">Entre 200€ y 500€</option>
        
        </select>
    </label>
</form>
 
</body>
</html>
