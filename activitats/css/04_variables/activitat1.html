<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Variables CSS</title>
    <style>
        :root {
            --colorprincipal: #c02942;
        }

        h1 {
            color: var(--colorprincipal);
        }

        a {
            color: var(--colorprincipal);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <h1>Ejemplo con variables CSS</h1>

    <p>
        Este párrafo contiene algunos
        <a href="#">enlaces</a> para
        <a href="#">demostrar</a> el uso
        de variables.
    </p>

</body>
</html>
