<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Taula</title>
  <style>
    

    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      padding: 2rem;
    }

    .rectangle {
      max-width: 800px;
      margin: 0 auto;
      background: #fff;
      border: 1px  #ccc;
    }

    .linea {
      border-top: 1px solid #ccc;
    }

   

    .header {
      display: flex;
      justify-content: space-between;
    
      padding: 1.5rem;
    }

    .header h3 {
      margin: 0;
      font-size: 1rem;
      font-weight: 500;
    }

    .icono {
      width: 24px;
      height: 24px;
      border: 1px solid #3aa0b3;
      border-radius: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #3aa0b3;
      
    }

    
    
  </style>
</head>
<body>

  <div class="rectangle">

    <div class="linea">
      <div class="header">
        <h3>¿Qué métodos de pago se ofrecen?</h3>
        <span class="icono">+</span>
      </div>
    </div>

    <div class="linea">
      <div class="header">
        <h3>¿Cómo puedo cambiarme a un plan diferente?</h3>
        <span class="icono">−</span>
      </div>
      
    </div>

    <div class="linea">
      <div class="header">
        <h3>¿Puedo optar por comprar créditos?</h3>
        <span class="icono">+</span>
      </div>
    </div>

    <div class="linea">
      <div class="header">
        <h3>¿Hay precios especiales para quienes envían grandes volúmenes de correos electrónicos?</h3>
        <span class="icono">+</span>
      </div>
    </div>

    <div class="linea">
      <div class="header">
        <h3>¿Qué sucede si llego al límite de envíos o contactos?</h3>
        <span class="icono">+</span>
      </div>
    </div>

  </div>

</body>
</html>
