<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>cercles</title>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100px;
    
    background: #ffffff;
  }

  .cercle {
    width: 100px;
    height: 100px;
    border-radius: 100%;
    transition: transform 0.5s;
  }

  .vermell {
    background: red;
    margin-right: -50px; 
  }

  .blau {
    background: blue;
    opacity: 0.5;
    cursor: pointer;
  }

  .blau:hover {
    transform: translateX(-50px);
  }
</style>
</head>
<body>
  <div class="cercle vermell"></div>
  <div class="cercle blau"></div>
</body>
</html>
