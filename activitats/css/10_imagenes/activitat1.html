<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat simple</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f0f0;
    }

    

    article {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
    }

    .misatge {
      background: white;
      padding: 8px;
      border-radius: 8px;
    }

    .nom {
      font-weight: bold;
      font-size: 15px;
    }

    .data {
      font-size: 13px;
      color: gray;
    }

  
  </style>
</head>

<body>



    <article>
      <img src="alexander.jpg" alt="avatar">
      <div class="misatge">
        <div class="nom">Alexander Madsen</div>
        <div class="data">30/01/2026</div>
        <p>Demà no podré vindre al partit</p>
      </div>
    </article>

    <article>
      <img src="bate.jpg" alt="avatar">
      <div class="misatge">
        <div class="nom">James Batemon</div>
        <div class="data">30/01/2026</div>
        <p>Putada jefe</p>
      </div>
    </article>



</body>
</html>
